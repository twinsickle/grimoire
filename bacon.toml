# Development loop. `bacon serve` rebuilds and restarts the daemon on every
# save. It reads this repository's intent from the server .grimoire.toml
# names, which `node scripts/dev.mjs` starts beside it.
# See "Development loop" in README.md.

default_job = "check"

[jobs.check]
command = ["cargo", "check", "--workspace", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--workspace", "--all-targets", "--color", "always"]
need_stdout = false

# The frontend lint and type check, re-run when web/src changes. The same
# two commands the pre-push hook runs (scripts/pre-push).
[jobs.web]
command = ["npm", "--prefix", "web", "run", "--silent", "check"]
need_stdout = true
watch = ["web/src", "web/visual", "web/eslint.config.js", "web/tsconfig.json"]
default_watch = false

[jobs.test]
command = ["cargo", "test", "--workspace", "--color", "always"]
need_stdout = true

# The daemon. Long-running, so bacon kills and restarts it when the source
# changes. Its intent is the server's that .grimoire.toml names, with this
# checkout's code.
[jobs.serve]
command = ["cargo", "run", "--quiet", "--", "serve", "--port", "4242", "--ui-dir", "web/dist"]
need_stdout = true
background = false
on_change_strategy = "kill_then_restart"
allow_warnings = true

# The lints over this repository's own grimoire, as a hook or CI would run them.
[jobs.lint]
command = ["cargo", "run", "--quiet", "--", "check"]
need_stdout = true
allow_warnings = true

[keybindings]
s = "job:serve"
l = "job:lint"
c = "job:clippy"
w = "job:web"
