[package]
name = "grimoire-server"
description = "The grimoire serve daemon: watching, JSON API, MCP over streamable HTTP, SSE updates, embedded web UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "grimoire_server"
path = "src/lib.rs"

[dependencies]
grimoire-core.workspace = true
grimoire-extract.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
ignore.workspace = true
directories.workspace = true
time.workspace = true
toml.workspace = true
rmcp.workspace = true
tracing.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
rust-embed = { version = "8", features = ["mime-guess"] }

[dev-dependencies]
tempfile.workspace = true
